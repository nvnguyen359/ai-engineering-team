  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" stroke="url(#accent)" stroke-width="4"/>
  <!-- Hub lines -->
  <g stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="54" x2="36" y2="82"/>
    <line x1="64" y1="54" x2="64" y2="88"/>
    <line x1="64" y1="54" x2="92" y2="82"/>
  </g>
  <!-- Lead node (An) -->
  <circle cx="64" cy="44" r="14" fill="url(#accent)"/>
  <circle cx="64" cy="44" r="6" fill="#ffffff"/>
  <!-- Squad nodes -->
  <circle cx="36" cy="84" r="10" fill="#10b981"/>
  <circle cx="64" cy="90" r="10" fill="#3b82f6"/>
  <circle cx="92" cy="84" r="10" fill="#8b5cf6"/>
